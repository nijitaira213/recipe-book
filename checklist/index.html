<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="保育園の持ちもの" />
  <title>🎒 保育園の持ちもの</title>
  <style>
    :root {
      --bg: #fff8f0;
      --surface: #ffffff;
      --accent: #ff8c42;
      --accent-light: #fff0e6;
      --accent-dark: #e06c20;
      --checked-bg: #f0f0f0;
      --checked-text: #aaa;
      --text: #333;
      --sub: #888;
      --border: #eed9c4;
      --tag-opt: #f0a500;
      --tag-pm: #5da8e0;
      --shadow: rgba(200,120,50,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px));
    }

    /* ヘッダー */
    header {
      background: var(--accent);
      color: #fff;
      padding: 16px 20px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px var(--shadow);
    }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    header .sub { font-size: 0.78rem; opacity: 0.88; margin-top: 2px; }

    /* 進捗バー */
    .progress-wrap {
      background: var(--surface);
      padding: 14px 20px 10px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: calc(56px + env(safe-area-inset-top, 0px));
      z-index: 9;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--sub);
      margin-bottom: 6px;
    }
    .progress-label .count { font-weight: 700; color: var(--accent); font-size: 1rem; }
    .progress-bar-bg {
      height: 8px;
      background: #eee;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.3s ease;
    }
    .progress-bar-fill.done { background: #4caf50; }

    /* 完了メッセージ */
    .all-done {
      display: none;
      text-align: center;
      padding: 20px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #4caf50;
    }

    /* リスト */
    .list { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }

    .item {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      transition: background 0.18s, opacity 0.18s, border-color 0.18s;
      -webkit-user-select: none;
      user-select: none;
      min-height: 56px;
    }
    .item:active { transform: scale(0.98); }
    .item.checked {
      background: var(--checked-bg);
      border-color: #ddd;
      opacity: 0.7;
    }

    /* チェックボックス */
    .checkbox {
      width: 26px;
      height: 26px;
      min-width: 26px;
      border-radius: 50%;
      border: 2.5px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.18s, border-color 0.18s;
      margin-top: 1px;
      font-size: 0.9rem;
    }
    .item.checked .checkbox {
      background: #4caf50;
      border-color: #4caf50;
      color: #fff;
    }

    /* テキスト */
    .item-body { flex: 1; }
    .item-name {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.4;
      transition: color 0.18s, text-decoration 0.18s;
    }
    .item.checked .item-name {
      color: var(--checked-text);
      text-decoration: line-through;
    }
    .item-note {
      font-size: 0.78rem;
      color: var(--sub);
      margin-top: 3px;
      line-height: 1.4;
    }
    .item.checked .item-note { color: #bbb; }

    /* バッジ */
    .badges { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
    .badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .badge-opt { background: #fff3d6; color: var(--tag-opt); }
    .badge-pm  { background: #e0f0ff; color: var(--tag-pm); }

    /* リセットボタン */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 20px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      background: var(--bg);
      border-top: 1px solid var(--border);
      z-index: 10;
    }
    .btn-reset {
      width: 100%;
      padding: 15px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s, transform 0.1s;
    }
    .btn-reset:active { background: var(--accent-dark); transform: scale(0.97); }
    .btn-reset:disabled { background: #ccc; }
  </style>
</head>
<body>

<header>
  <h1>🎒 保育園の持ちもの</h1>
  <div class="sub">タップしてチェック ✔</div>
</header>

<div class="progress-wrap">
  <div class="progress-label">
    <span>進捗</span>
    <span><span class="count" id="doneCount">0</span> / <span id="totalCount">0</span> 完了</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
  </div>
  <div class="all-done" id="allDone">✅ 準備完了！いってらっしゃい🌟</div>
</div>

<div class="list" id="list"></div>

<div class="footer">
  <button class="btn-reset" id="resetBtn" onclick="resetAll()">🔄 全部リセット（次の日用）</button>
</div>

<script>
const ITEMS = [
  { id: 'straw',    name: 'ストローマグ / 保冷ストローマグ', note: '麦茶か水を入れてきてください' },
  { id: 'cup',      name: 'コップ' },
  { id: 'hat',      name: '帽子' },
  { id: 'shoes',    name: '外ズック' },
  { id: 'diaper',   name: 'オムツ', note: '3枚' },
  { id: 'wipe',     name: 'おしり拭き' },
  { id: 'towel1',   name: 'オムツ交換用タオル', note: '1枚' },
  { id: 'towel2',   name: '体を拭くタオル', note: '1枚' },
  { id: 'clothes',  name: '着替え', note: '各2枚ずつ（肌着・上下衣服・靴下）' },
  { id: 'dirtybag', name: '汚れた衣服を入れる袋' },
{ id: 'futon',    name: '午睡用布団セット', note: '敷パット・タオルケット・袋', pm: true },
];

const KEY = 'hoikuen_checks';
let checked = JSON.parse(localStorage.getItem(KEY) || '{}');

function save() { localStorage.setItem(KEY, JSON.stringify(checked)); }

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  ITEMS.forEach(item => {
    const div = document.createElement('div');
    div.className = 'item' + (checked[item.id] ? ' checked' : '');
    div.onclick = () => toggle(item.id);

    const badges = [];
    if (item.opt) badges.push('<span class="badge badge-opt">必要な方のみ</span>');
    if (item.pm)  badges.push('<span class="badge badge-pm">午後利用の方のみ</span>');

    div.innerHTML = `
      <div class="checkbox">${checked[item.id] ? '✓' : ''}</div>
      <div class="item-body">
        <div class="item-name">${item.name}</div>
        ${item.note ? `<div class="item-note">${item.note}</div>` : ''}
        ${badges.length ? `<div class="badges">${badges.join('')}</div>` : ''}
      </div>
    `;
    list.appendChild(div);
  });
  updateProgress();
}

function toggle(id) {
  checked[id] = !checked[id];
  save();
  render();
}

function updateProgress() {
  const total = ITEMS.length;
  const done = ITEMS.filter(i => checked[i.id]).length;
  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = total;
  const pct = total ? (done / total * 100) : 0;
  const bar = document.getElementById('progressBar');
  bar.style.width = pct + '%';
  bar.className = 'progress-bar-fill' + (done === total ? ' done' : '');
  const allDone = document.getElementById('allDone');
  allDone.style.display = (done === total && total > 0) ? 'block' : 'none';
  document.getElementById('resetBtn').disabled = done === 0;
}

function resetAll() {
  if (!confirm('チェックをすべてリセットしますか？')) return;
  checked = {};
  save();
  render();
}

render();
</script>
</body>
</html>
